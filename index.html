    <meta charset="UTF-8" />

    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>सर्वसेतु AI - राष्ट्रीय डिजिटल नागरिक सेवा सेतु</title>

    <!-- ऑटोमैटिक कैशे किलर: फोन से पुरानी फाइल्स खुद डिलीट होंगी -->
    <script>
      (function() {
        var CURRENT_DEPLOY = "sarvasetu_clean_1789441292";
        var lastDeploy = localStorage.getItem("sarvasetu_purge_key");
        if (lastDeploy !== CURRENT_DEPLOY) {
          if (window.caches) {
            caches.keys().then(function(names) {
              for (var i = 0; i < names.length; i++) caches.delete(names[i]);
            });
          }
          if (navigator.serviceWorker) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              for (var i = 0; i < regs.length; i++) regs[i].unregister();
            });
          }
          localStorage.setItem("sarvasetu_purge_key", CURRENT_DEPLOY);
          window.location.reload(true);
        }
      })();
    </script>
