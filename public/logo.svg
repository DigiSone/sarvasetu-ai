<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="saffronGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9933" />
      <stop offset="100%" stop-color="#E65100" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D47A1" />
      <stop offset="100%" stop-color="#1A237E" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#138808" />
      <stop offset="100%" stop-color="#1B5E20" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- सुरक्षा शील्ड बैकग्राउंड -->
  <path d="M256 32 C384 32, 448 88, 448 192 C448 336, 320 432, 256 480 C192 432, 64 336, 64 192 C64 88, 128 32, 256 32 Z" 
        fill="#FFFFFF" stroke="#E2E8F0" stroke-width="8" filter="url(#dropShadow)" />

  <!-- डिजिटल सेतु मेहराब (Tri-Color Bridge Arches) -->
  <path d="M120 280 C180 180, 332 180, 392 280" fill="none" stroke="url(#saffronGrad)" stroke-width="20" stroke-linecap="round" />
  <path d="M148 310 C196 230, 316 230, 364 310" fill="none" stroke="url(#blueGrad)" stroke-width="16" stroke-linecap="round" />
  <path d="M176 340 C212 280, 300 280, 336 340" fill="none" stroke="url(#greenGrad)" stroke-width="14" stroke-linecap="round" />

  <!-- केंद्रीय चक्र स्तंभ व डिजिटल नोड -->
  <circle cx="256" cy="170" r="42" fill="url(#blueGrad)" />
  <circle cx="256" cy="170" r="32" fill="#FFFFFF" />
  <circle cx="256" cy="170" r="14" fill="url(#saffronGrad)" />

  <!-- चक्र स्पोक्स -->
  <line x1="256" y1="138" x2="256" y2="202" stroke="#0D47A1" stroke-width="4" stroke-linecap="round" />
  <line x1="224" y1="170" x2="288" y2="170" stroke="#0D47A1" stroke-width="4" stroke-linecap="round" />
  <line x1="233" y1="147" x2="279" y2="193" stroke="#0D47A1" stroke-width="3" stroke-linecap="round" />
  <line x1="233" y1="193" x2="279" y2="147" stroke="#0D47A1" stroke-width="3" stroke-linecap="round" />

  <!-- आधार स्तंभ -->
  <rect x="206" y="380" width="100" height="12" rx="6" fill="#0D47A1" />
  <rect x="226" y="398" width="60" height="8" rx="4" fill="#64748B" />
</svg>
